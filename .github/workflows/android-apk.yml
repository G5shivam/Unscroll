# Builds an installable Unscroll APK on GitHub's servers (no Android Studio needed).
# Run it from the repo's Actions tab ("Run workflow"), then download the
# "unscroll-apk" artifact from the finished run.
name: Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub's free runners have ~14 GB free; a React Native build needs more.
      # Remove large preinstalled tools this build never uses (keeps the Android SDK).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/heroku \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /opt/microsoft /opt/google/chrome /opt/az
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --silent

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          UNSCROLL_RELEASE: 1

      # arm64-v8a only: covers almost every Android phone from the last 6-7 years
      # and needs a quarter of the disk and time of building all four CPU types.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Disk usage after build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: unscroll-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Kotlin enforcer tests on a separate runner so they don't compete for disk.
  kotlin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Kotlin enforcer tests
        working-directory: android
        run: ./gradlew :unscroll-blocker:testDebugUnitTest --no-daemon -PreactNativeArchitectures=arm64-v8a
